[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waypoint-etl"
version = "0.1.0"
description = "Waypoint - ERP & CRM Data Migration Toolkit (open-source, educational)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Waypoint Contributors" }]
keywords = ["etl", "data-migration", "erp", "crm", "ocr", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # Extração e transformação
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pillow>=10.3",
    "pymupdf>=1.24",
    # OCR
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    # Validação e dados
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    # Interface e CLI
    "streamlit>=1.35",
    "typer>=0.12",
    # Configuração
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
waypoint-etl = "waypoint_etl.presentation.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/waypoint-etl"
Repository = "https://github.com/your-org/waypoint-etl"

[tool.hatch.build.targets.wheel]
packages = ["src/waypoint_etl"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["waypoint_etl"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["waypoint_etl"]

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "pytesseract.*",
    "cv2.*",
    "fitz.*",
    "docx.*",
    "streamlit.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest / Coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes de integração (podem exigir serviços externos)",
]

[tool.coverage.run]
branch = true
source = ["waypoint_etl"]
omit = ["*/presentation/streamlit/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
