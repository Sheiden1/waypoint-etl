<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Resultado de uma migração em dry-run no Waypoint</title>
  <desc id="desc">Terminal mostra 55 registros processados, 45 válidos, 10 rejeitados e 4 duplicatas.</desc>
  <rect width="1200" height="675" rx="24" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="58" cy="58" r="8" fill="#ff7b72"/>
  <circle cx="84" cy="58" r="8" fill="#d29922"/>
  <circle cx="110" cy="58" r="8" fill="#3fb950"/>
  <text x="600" y="64" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="18">Waypoint · dry-run</text>
  <g font-family="Consolas, monospace" font-size="22">
    <text x="62" y="120" fill="#58a6ff">$ waypoint-etl migrate --input clientes_legado.csv --dry-run</text>
    <text x="62" y="170" fill="#c9d1d9">run_id:      1e033482-8b4a-4d24-88da-06b1b08f39e9</text>
    <text x="62" y="206" fill="#c9d1d9">Entidade:    customers</text>
    <text x="62" y="242" fill="#c9d1d9">Modo:        dry-run</text>
    <text x="62" y="306" fill="#c9d1d9">Total:       55</text>
    <text x="62" y="342" fill="#3fb950">Válidos:     45</text>
    <text x="62" y="378" fill="#ff7b72">Rejeitados:  10</text>
    <text x="62" y="414" fill="#d29922">Duplicatas:  4</text>
    <text x="62" y="450" fill="#c9d1d9">Suspeitas:   0</text>
    <text x="62" y="514" fill="#8b949e">accepted.csv · rejected.xlsx · duplicates.csv</text>
    <text x="62" y="550" fill="#8b949e">audit-report.json</text>
  </g>
  <rect x="760" y="276" width="340" height="188" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="930" y="324" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="18">Pipeline</text>
  <text x="930" y="365" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, sans-serif" font-size="20">extrair → mapear → validar</text>
  <text x="930" y="405" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, sans-serif" font-size="20">deduplicar → exportar</text>
  <text x="930" y="445" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI, sans-serif" font-size="16">rastreável por run_id</text>
</svg>
