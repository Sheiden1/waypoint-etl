name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Interface web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Testes
        working-directory: web
        run: npm run test:run

      - name: Build
        working-directory: web
        run: npm run build

  quality:
    name: Testes e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: waypoint_test
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WAYPOINT_TEST_DATABASE_URL: postgresql+psycopg://waypoint:waypoint@localhost:5432/waypoint_test
      OCR_LANGUAGE: por

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy

      - name: Testes e cobertura
        run: uv run pytest --cov=waypoint_etl --cov-report=term-missing

      - name: Construir a distribuição
        run: uv build

  container:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, web-quality]

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Validar configuração
        run: docker compose config --quiet

      - name: Construir e iniciar
        run: docker compose up --build --detach

      - name: Aguardar a aplicação
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Encerrar os serviços
        if: always()
        run: docker compose down --volumes
