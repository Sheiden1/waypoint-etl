# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: waypoint-etl-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: OCR_LANGUAGE
        value: por
      - key: EXPORT_DIR
        value: /tmp/waypoint-exports
      - key: ARTIFACT_TTL_SECONDS
        value: "1800"
      - key: WEB_ORIGINS
        sync: false
